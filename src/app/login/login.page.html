<ion-content class="wrap">
  
  <div class="card">
    
    <div class="accent-bar"></div>

    <div class="brand">
      <div class="brand-icon">
        <img src="assets/logo.svg">
      </div>
      <h1>cashflow</h1>
      <p>Ingresá a tu cuenta personal</p>
    </div>

    <form autocomplete="on" (ngSubmit)="onLogin()">

      <div class="field">
        <label>Usuario</label>
        <div class="input-wrap">
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            autocomplete="email"
            placeholder="ejemplo@email.com" 
          />
        </div>
      </div>

      <div class="field">
        <label>Contraseña</label>
        <div class="input-wrap">
          <input 
            type="password" 
            [(ngModel)]="password" 
            name="password"
            autocomplete="current-password"
          />
        </div>
      </div>

      <label class="error">{{error}}</label>

      <div class="actions">
        <button type="submit" class="btn-primary" (click)="onLogin()">
          Iniciar sesión
        </button>

        <div class="divider"><span>¿Primera vez?</span></div>

        <button type="button" class="btn-secondary" (click)="onRegister()">
          Crear cuenta
        </button>
      </div>

    </form>

    @if (isLoading) {
      <div class="spiner">  
        <ion-spinner color="tertiary" name="circular"></ion-spinner>
      </div>
    }

  </div>
</ion-content>
